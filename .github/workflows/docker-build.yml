name: Build & Push Image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Configure git for private submodules
        run: |
          git config --global url."https://${{ secrets.GH_PAT }}@github.com/".insteadOf "git@github.com:"
          git config --global url."https://${{ secrets.GH_PAT }}@github.com/".insteadOf "https://github.com/"

      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          submodules: recursive

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase repo owner
        id: lower
        run: echo "owner=${OWNER,,}" >> "$GITHUB_OUTPUT"
        env:
          OWNER: ${{ github.repository_owner }}

      - name: Compute lean image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.lower.outputs.owner }}/xmatcher
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & push lean image
        id: lean
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Compute bundled image tags
        id: meta_bundled
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.lower.outputs.owner }}/xmatcher
          # Suffix every lean tag with `-bundled` so they don't collide.
          tags: |
            type=ref,event=branch,suffix=-bundled
            type=ref,event=tag,suffix=-bundled
            type=sha,format=long,suffix=-bundled
            type=raw,value=latest-bundled,enable={{is_default_branch}}

      - name: Diagnose HuggingFace reachability from runner
        run: |
          set -x
          echo "--- runner geo ---"
          curl -sS -m 10 https://ipinfo.io/json || true
          echo
          echo "--- DNS ---"
          getent hosts huggingface.co || true
          echo
          echo "--- HEAD model card ---"
          curl -sSI -m 15 -A "xmatcher-diag/0.1" \
            https://huggingface.co/zju-community/efficientloftr | head -20 || true
          echo
          echo "--- HEAD resolve URL (the one that fails) ---"
          curl -sSI -m 15 -A "xmatcher-diag/0.1" \
            https://huggingface.co/zju-community/efficientloftr/resolve/main/eloftr_outdoor.ckpt \
            | head -25 || true
          echo
          echo "--- HEAD using HF API ---"
          curl -sS -m 15 -A "xmatcher-diag/0.1" \
            https://huggingface.co/api/models/zju-community/efficientloftr | head -c 1500 || true
          echo
          echo "--- GET resolve URL with -L (follow redirects), 256 bytes ---"
          curl -sSL -m 30 -A "xmatcher-diag/0.1" \
            https://huggingface.co/zju-community/efficientloftr/resolve/main/eloftr_outdoor.ckpt \
            -o /tmp/probe.bin -w 'HTTP=%{http_code} URL=%{url_effective} SIZE=%{size_download}\n' || true
          file /tmp/probe.bin || true
          head -c 256 /tmp/probe.bin | xxd | head -10 || true

      - name: Build & push bundled image (weights baked in)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.bundled
          push: true
          # Pin the bundled stage's FROM to the digest we just pushed,
          # so the two images are always consistent within a single run.
          build-args: |
            BASE_IMAGE=ghcr.io/${{ steps.lower.outputs.owner }}/xmatcher@${{ steps.lean.outputs.digest }}
          tags: ${{ steps.meta_bundled.outputs.tags }}
          labels: ${{ steps.meta_bundled.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
