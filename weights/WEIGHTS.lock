# Schema: <method> -> <variant> -> {source, sha256, target}
# source is one of: gdrive_id, http_url
#
# When sha256 is set to "BOOTSTRAP", run:
#     scripts/download_weights.sh efficient_loftr --bootstrap
# The script will download the file, print its sha256, and ask you to paste
# the value back here. Subsequent runs without --bootstrap will hard-error
# until the placeholder is replaced.

efficient_loftr:
  outdoor:
    http_url: "https://huggingface.co/zju-community/efficientloftr/resolve/main/eloftr_outdoor.ckpt"
    sha256:   "0af6291141c736e75e94b7f8aae4399b77c7731b3f08758212b2cfe370188878"
    target:   "efficient_loftr/eloftr_outdoor.ckpt"

# LightGlue weights — at runtime the adapter relies on torch.hub auto-download
# into ~/.cache/torch/hub/checkpoints/. These entries exist for:
#   1. Integrity audit (sha256 of the pinned release artifacts).
#   2. Offline / air-gapped bootstrap (pre-fetch into XMATCHER_WEIGHTS_DIR,
#      then symlink/copy into ~/.cache/torch/hub/checkpoints/).
# Release tag: v0.1_arxiv. Bumping requires updating both URL and sha256.
lightglue:
  superpoint_extractor:
    http_url: "https://github.com/cvg/LightGlue/releases/download/v0.1_arxiv/superpoint_v1.pth"
    sha256:   "52b6708629640ca883673b5d5c097c4ddad37d8048b33f09c8ca0d69db12c40e"
    target:   "lightglue/superpoint_v1.pth"
  superpoint_matcher:
    http_url: "https://github.com/cvg/LightGlue/releases/download/v0.1_arxiv/superpoint_lightglue.pth"
    sha256:   "6ff7040d0a497fc6639337946d7538dae07428c18f77a067a0b5a960e7cc551a"
    target:   "lightglue/superpoint_lightglue.pth"
